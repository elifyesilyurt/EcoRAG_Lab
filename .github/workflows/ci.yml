name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Code style and lint check (Ruff)
        run: |
          ruff check --line-length=120 --ignore E501,BLE001,TRY004,UP,B017,I001 dynamic_math_engine.py test_dynamic_math.py test_baseline_regressions.py test_resource_metrics.py test_math_response.py query_routing.py test_query_routing.py temporal_scope.py test_temporal_scope.py

      - name: Run offline baseline and regression tests
        run: |
          python -m unittest test_dynamic_math test_baseline_regressions test_resource_metrics test_math_response test_query_routing test_temporal_scope -v
